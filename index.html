function layout(){  var showPanel=(UI.tab==="waiting"||UI.tab==="duty");  return "<div class='stripe'></div>"+    "<div class='banner'>🚌 نظام الدوام: الأحد - الاثنين عن بُعد | الثلاثاء - الخميس حضوري</div>"+    "<header id='mainHeader'><div class='hwrap'>"+    "<div style='display:flex;gap:12px;align-items:center'>"+    "<div class='logo'><img src='logo.png' alt='شعار' onerror=\"this.style.display='none';this.parentNode.innerHTML='زيد';\"></div>"+    "<div><h1>ابتدائية زيد بن ثابت</h1>"+    "<div class='sub'>565 طالب • 18 فصل • 44 موظف • V16.1</div></div></div>"+    "<div style='display:flex;gap:8px;align-items:center;flex-wrap:wrap'>"+    "<span class='badge'>✅ 31-32 طالب/فصل</span>"+    "<button class='icon-btn' data-act='do' data-id='print' title='طباعة'>🖨️</button>"+    "<button class='icon-btn' data-act='do' data-id='dark' title='وضع'>"+(UI.dark?'☀️':'🌙')+"</button>"+    "</div></div></header>"+    "<div class='layout'>"+    "<aside class='side'><h3>📋 القائمة الرئيسية</h3>"+    SECTIONS.map(function(s){return "<button class='"+(UI.tab===s.id?"on":"")+"' data-act='tab' data-id='"+s.id+"'><span class='ico'>"+s.icon+"</span> "+s.label+"</button>";}).join("")+    "<button data-act='do' data-id='logout' style='color:#dc2626'><span class='ico'>🚪</span> خروج</button></aside>"+    "<main class='main'>"+sectionHTML()+"</main>"+    (showPanel?teacherPanel():"")+"</div>"+    "<div class='stripe'></div>"+footerHTML();}

function render(){  var r=document.getElementById('root');  r.innerHTML=UI.auth?layout():loginHTML();  if(UI.dark)document.documentElement.classList.add('dark');  else document.documentElement.classList.remove('dark');  var f=document.getElementById('loginForm');  if(f)f.onsubmit=function(e){    e.preventDefault();    var u=document.getElementById('lu').value,p=document.getElementById('lp').value;    if(u==="admin"&&hash(p)===DB.pwdHash){      localStorage.setItem("zaid_auth","1");UI.auth=true;render();toast('مرحباً بك في المنصة');      playBeep(880,0.15);    }else{      document.getElementById('lerr').textContent="بيانات الدخول غير صحيحة";      toast('بيانات خاطئة','err');vibrate([50,50,50]);    }  };}
function applySlot(slot,id){  var i=slot.indexOf(":"),type=slot.slice(0,i),key=slot.slice(i+1);  if(type==="w"){DB.waiting[key]=id;}  else{var l=DB.duty[key]||[];if(l.indexOf(id)<0)l.push(id);DB.duty[key]=l;}  save();UI.selTeacher=null;render();toast('تم التعيين بنجاح');playBeep(700,0.1);}
function exportBackup(){  var data={exportDate:nowStr(),students:DB.students,waiting:DB.waiting,duty:DB.duty,teachers:TEACHERS};  var a=document.createElement("a");  a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));  a.download="zaid-backup-"+Date.now()+".json";a.click();  toast('تم تصدير النسخة');}
function exportCSV(){  var rows=[['الاسم','الفصل','الجوال','الحضور']];  DB.students.forEach(function(s){rows.push([s.name,clsLabel(s.classId),s.phone,s.attendance]);});  var csv='\uFEFF'+rows.map(function(r){return r.map(function(x){return '"'+(x||'')+'"';}).join(',');}).join('\n');  var a=document.createElement("a");  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));  a.download="students-"+Date.now()+".csv";a.click();  toast('تم تصدير Excel');}
function importBackup(f){  if(!f)return;  var r=new FileReader();  r.onload=function(){    try{      var d=JSON.parse(r.result);      if(d.students)DB.students=d.students;      if(d.waiting)DB.waiting=d.waiting;      if(d.duty)DB.duty=d.duty;      save();render();toast('تم الاستيراد بنجاح');    }catch(e){toast('ملف غير صالح','err');}  };  r.readAsText(f);}
function importNames(text){  var names=text.split(/\r?\n/).map(function(s){return s.trim();}).filter(function(s){return s.length>2;});  if(names.length<10){toast('أدخل 10 أسماء على الأقل','err');return;}  var rng=mulberry32(2030);  var total=Math.min(names.length,600);  var perClass=Math.ceil(total/CLASSES.length);  var newStudents=[],idx=0;  CLASSES.forEach(function(cls){    for(var k=0;k<perClass && idx<total;k++){      newStudents.push({id:"s"+(idx+1),name:names[idx],classId:cls.id,phone:"05"+String(Math.floor(rng()*1e8)).padStart(8,"0"),attendance:rng()>0.12?"حاضر":"غائب",grades:{}});      idx++;    }  });  DB.students=newStudents;save();render();  toast('تم استيراد '+newStudents.length+' طالب');}
function fillWaitingAuto(){  var rng=mulberry32(Date.now()&0xFFFF);  var pool=TEACHERS.filter(function(t){return t.role==="معلم";});  var shuffled=pool.slice().sort(function(){return rng()-0.5;});  var idx=0;  DAYS.forEach(function(d){PERIODS.forEach(function(p){DB.waiting[d+"-"+p]=shuffled[idx%shuffled.length].id;idx++;});});  save();render();toast('تم التوزيع التلقائي العادل');}
var root=document.getElementById("root");root.addEventListener("click",function(e){  var el=e.target.closest("[data-act]");  if(el){    var a=el.dataset.act;    if(a==="tab"){UI.tab=el.dataset.id;UI.showCount=50;UI.search="";UI.selTeacher=null;render();}    else if(a==="sel-t"){var id=el.dataset.id;UI.selTeacher=UI.selTeacher===id?null:id;document.querySelectorAll(".tcard").forEach(function(c){if(c.dataset.id)c.classList.toggle("sel",c.dataset.id===UI.selTeacher);});}    else if(a==="att"){var s=DB.students.find(function(x){return x.id===el.dataset.id;});if(s){s.attendance=s.attendance==="حاضر"?"غائب":"حاضر";save();el.className="chip "+(s.attendance==="حاضر"?"chip-green":"chip-red");el.textContent=(s.attendance==="حاضر"?"✅ ":"❌ ")+s.attendance;playBeep(s.attendance==="حاضر"?900:400,0.08);}}    else if(a==="clr-w"){delete DB.waiting[el.dataset.key];save();render();}    else if(a==="clr-d"){var parts=el.dataset.key.split("|");DB.duty[parts[0]]=(DB.duty[parts[0]]||[]).filter(function(x){return x!==parts[1];});save();render();}    else if(a==="more"){UI.showCount+=50;var r1=document.getElementById("stuRows");if(r1)r1.innerHTML=studentsRows();var r2=document.getElementById("parRows");if(r2)r2.innerHTML=parentsRows();}    else if(a==="import"){importBackup(el.files[0]);}    else if(a==="do"){      var act=el.dataset.id;      if(act==="print"){window.print();}      else if(act==="dark"){UI.dark=!UI.dark;render();}      else if(act==="logout"){if(confirm('هل تريد الخروج؟')){localStorage.removeItem("zaid_auth");UI.auth=false;render();}}      else if(act==="export"){exportBackup();}      else if(act==="export-csv"){exportCSV();}      else if(act==="import-btn"){document.getElementById("importFile").click();}      else if(act==="sms-send"){toast('تم تسجيل الرسالة (محاكاة محلية)');}      else if(act==="import-names"){var t=document.getElementById("importArea").value;importNames(t);}      else if(act==="fill-waiting-auto"){fillWaitingAuto();}      else if(act==="clear-waiting"){if(confirm('مسح كل حصص الانتظار؟')){DB.waiting={};save();render();toast('تم المسح','warn');}}      else if(act==="clear-duty"){if(confirm('مسح كل المناوبات؟')){DB.duty={};save();render();toast('تم المسح','warn');}}      else if(act==="pwd"){var o=document.getElementById("po").value,n=document.getElementById("pn").value;if(hash(o)!==DB.pwdHash)toast("كلمة المرور الحالية خاطئة","err");else if(n.length<6)toast("كلمة المرور قصيرة (6+)","err");else{DB.pwdHash=hash(n);save();toast("تم تغيير كلمة المرور");audit("تغيير كلمة المرور");}}      else if(act==="reset"){if(confirm("⚠️ سيُحذف كل شيء. متأكد؟")){localStorage.clear();location.reload();}}    }    return;  }  var sl=e.target.closest("[data-slot]");  if(sl&&UI.selTeacher)applySlot(sl.dataset.slot,UI.selTeacher);});
root.addEventListener("input",function(e){  var el=e.target.closest("[data-act]");if(!el)return;  if(el.dataset.act==="search"){UI.search=el.value;var r1=document.getElementById("stuRows");if(r1)r1.innerHTML=studentsRows();var r2=document.getElementById("parRows");if(r2)r2.innerHTML=parentsRows();var c=document.getElementById("stuCount");if(c)c.textContent=filteredStudents().length;}  else if(el.dataset.act==="import-names"){var t=el.value;var n=t.split(/\r?\n/).filter(function(x){return x.trim().length>2;}).length;var ic=document.getElementById("importCount");if(ic)ic.textContent=n;}  else if(el.dataset.act==="grade"){var sid=el.dataset.sid,sub=el.dataset.sub;var s=DB.students.find(function(x){return x.id===sid;});if(s){s.grades=s.grades||{};s.grades[sub]=el.value;save();}}});
root.addEventListener("change",function(e){  var el=e.target.closest("[data-act]");if(!el)return;  if(el.dataset.act==="filter-cls"){UI.clsFilter=el.value;UI.showCount=50;var r1=document.getElementById("stuRows");if(r1)r1.innerHTML=studentsRows();var c=document.getElementById("stuCount");if(c)c.textContent=filteredStudents().length;}  else if(el.dataset.act==="sel-class"){UI.selClass=el.value;var sb=document.getElementById("schedBody");if(sb)sb.innerHTML=schedRows();}  else if(el.dataset.act==="import"){importBackup(el.files[0]);}});
root.addEventListener("dragstart",function(e){var el=e.target.closest("[data-drag]");if(!el)return;e.dataTransfer.setData("text/plain",el.dataset.id);UI.selTeacher=el.dataset.id;el.classList.add("sel");});root.addEventListener("dragend",function(e){var el=e.target.closest("[data-drag]");if(el)el.classList.remove("sel");});root.addEventListener("dragover",function(e){var sl=e.target.closest("[data-slot]");if(sl){e.preventDefault();sl.classList.add("hover");}});root.addEventListener("dragleave",function(e){var sl=e.target.closest("[data-slot]");if(sl)sl.classList.remove("hover");});root.addEventListener("drop",function(e){var sl=e.target.closest("[data-slot]");if(!sl)return;e.preventDefault();sl.classList.remove("hover");var id=e.dataTransfer.getData("text/plain")||UI.selTeacher;if(id)applySlot(sl.dataset.slot,id);});
window.addEventListener("scroll",function(){  var b=document.getElementById("backTop");  if(b){if(window.scrollY>400)b.classList.add("show");else b.classList.remove("show");}  var h=document.getElementById("mainHeader");  if(h){if(window.scrollY>20)h.classList.add("scrolled");else h.classList.remove("scrolled");}});var bt=document.getElementById("backTop");if(bt)bt.addEventListener("click",function(){window.scrollTo({top:0,behavior:'smooth'});});

   دوال الاتصال بـ Google Apps Script
   ============================================================== */
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwOyjWJ8loVh6aDCy2tdY-DWdTkO-wtItJ3LKOKMGJVhLxaG6cU5A1k21AoI7n7jWzIsA/exec';

window.saveEmployee = function() {
    const username = document.getElementById('empUsername').value;
    if(!username) { toast('يرجى إدخال اسم المستخدم', 'err'); return; }
    
    const data = {
        action: 'updateUser',
        sheetName: 'المستخدمين',
        recordData: {
            id: username,
            values: [
                document.getElementById('empName').value,
                username,
                document.getElementById('empPassword').value,
                document.getElementById('empRole').value,
                document.getElementById('empSpecialty').value,
                document.getElementById('empGrades').value
            ]
        }
    };
    window.sendToAPI(data);
};

window.deleteEmployee = function() {
    const username = document.getElementById('empUsername').value;
    if (!username) { toast('أدخل اسم المستخدم للحذف', 'err'); return; }
    if (!confirm('هل أنت متأكد من حذف المستخدم: ' + username + '؟')) return;

    const data = {
        action: 'deleteUser',
        sheetName: 'المستخدمين',
        recordId: username
    };
    window.sendToAPI(data);
};

window.sendToAPI = function(data) {
    toast('جاري إرسال البيانات...', 'info');
    fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify(data)
    })
    .then(response => response.json())
    .then(result => {
        if(result.status === 'success') {
            toast(result.message, 'ok');
            document.getElementById('empName').value = '';
            document.getElementById('empUsername').value = '';
            document.getElementById('empPassword').value = '';
            document.getElementById('empSpecialty').value = '';
            document.getElementById('empGrades').value = '';
        } else {
            toast(result.message, 'err');
        }
    })
    .catch(error => toast('حدث خطأ في الاتصال بقاعدة البيانات', 'err'));
};

(function boot(){  try{    var s=localStorage.getItem("szb_students");    if(s)DB.students=JSON.parse(s);    if(!DB.students||!DB.students.length){DB.students=buildStudents();save();}    var w=localStorage.getItem("szb_waiting");if(w)DB.waiting=JSON.parse(w);    var d=localStorage.getItem("szb_duty");if(d)DB.duty=JSON.parse(d);    var ph=localStorage.getItem("szb_pwdHash");if(ph)DB.pwdHash=ph;    var al=localStorage.getItem("szb_auditLog");if(al)DB.auditLog=JSON.parse(al);  }catch(e){DB.students=buildStudents();}
  UI.auth=localStorage.getItem("zaid_auth")==="1";
  try{var h=new Date().getHours();if(h>=19||h<6)UI.dark=true;}catch(e){}
  setTimeout(function(){    var sp=document.getElementById("splash");    if(sp){sp.classList.add("hide");setTimeout(function(){sp.remove();},700);}  },1400);
  render();})();</script></body></html>
