.magic-strip{max-width:1400px;margin:0 auto;padding:8px 20px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--card);border-bottom:1px solid rgba(22,163,74,.10)}
.magic-strip .magic-group{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.magic-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--brand-soft);border:1px solid rgba(22,163,74,.12);font-size:11px;font-weight:800;color:var(--ink);white-space:nowrap}
.magic-pill.online::before{content:"";width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 4px rgba(34,197,94,.12)}
.magic-pill.offline::before{content:"";width:7px;height:7px;border-radius:50%;background:#ef4444;box-shadow:0 0 0 4px rgba(239,68,68,.12)}
.magic-clock{font-variant-numeric:tabular-nums;direction:ltr}
.magic-tools{position:fixed;left:18px;bottom:84px;z-index:60;display:flex;flex-direction:column;gap:8px}
.magic-fab{width:48px;height:48px;border:0;border-radius:50%;background:linear-gradient(135deg,#16a34a,#15803d);color:#fff;cursor:pointer;box-shadow:0 12px 28px -8px rgba(22,163,74,.55);font-size:20px;transition:.25s}
.magic-fab:hover{transform:translateY(-3px) scale(1.04)}
.magic-menu{display:none;min-width:210px;padding:8px;background:var(--card);border:1px solid rgba(22,163,74,.15);border-radius:16px;box-shadow:0 18px 50px -15px rgba(0,0,0,.35)}
.magic-menu.show{display:block;animation:magicIn .2s ease}
.magic-menu button{width:100%;border:0;background:none;color:var(--ink);font-family:inherit;text-align:right;padding:10px 12px;border-radius:10px;font-weight:700;cursor:pointer}
.magic-menu button:hover{background:var(--brand-soft);color:var(--brand)}
@keyframes magicIn{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
.password-wrap-v24{position:relative;margin-bottom:12px}
.password-wrap-v24 .inp{margin-bottom:0!important;padding-left:52px}
.password-toggle-v24{position:absolute;left:8px;top:50%;transform:translateY(-50%);border:0;background:var(--brand-soft);border-radius:9px;width:36px;height:36px;cursor:pointer;font-size:16px}
.caps-v24{display:none;text-align:right;font-size:11px;font-weight:700;color:#b45309;margin:-7px 0 10px}
.login-tools-v24{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:-2px 0 12px;font-size:11px;color:var(--muted);font-weight:700}
.login-tools-v24 label{display:flex;align-items:center;gap:5px;cursor:pointer}
.login-tools-v24 input{accent-color:var(--brand)}
.magic-welcome{margin-top:10px;padding:10px 12px;border-radius:12px;background:linear-gradient(135deg,var(--brand-soft),transparent);font-size:12px;font-weight:800;color:var(--ink);border:1px solid rgba(22,163,74,.10)}
@media(max-width:600px){
  .magic-strip{padding:7px 12px}
  .magic-strip .magic-group:first-child{width:100%;justify-content:space-between}
  .magic-strip .magic-group:last-child{width:100%;justify-content:center}
  .magic-tools{left:10px;bottom:72px}
}
@media print{.magic-strip,.magic-tools{display:none!important}}
</style>
</style>
<style id="magic-v24-final-css">
.school-scope-v24{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0 16px}
.school-scope-v24 .scope-item{padding:11px 12px;border-radius:13px;background:linear-gradient(135deg,var(--brand-soft),transparent);border:1px solid rgba(22,163,74,.12)}
.school-scope-v24 .scope-title{font-size:11px;color:var(--muted);font-weight:800}
.school-scope-v24 .scope-value{font-size:15px;font-weight:900;color:var(--ink);margin-top:3px}
.class-badge-v24{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:999px;background:var(--brand-soft);color:var(--brand);font-size:10px;font-weight:900}
@media(max-width:700px){.school-scope-v24{grid-template-columns:1fr}}
</style>

<style id="school-logo-v24-css">
.login-card .logo,
#splash .splash-logo,
header .logo{
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}
.login-card .logo img,
header .logo img,
#splash .splash-logo img{
  width:100%;
  height:100%;
  object-fit:contain;
  border-radius:inherit;
  display:block;
  transition:transform .35s ease,filter .35s ease;
}
.login-card .logo:hover img,
header .logo:hover img{
  transform:scale(1.07);
  filter:drop-shadow(0 8px 12px rgba(22,163,74,.25));
}
#splash .splash-logo img{
  animation:schoolLogoFloatV24 4s ease-in-out infinite;
}
@keyframes schoolLogoFloatV24{
  0%,100%{transform:scale(1) translateY(0)}
  50%{transform:scale(1.035) translateY(-3px)}
}
</style>

<style id="communications-v24-css">
.comm-panel-v24{max-width:1050px;margin:0 auto 18px}
.comm-grid-v24{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.comm-card-v24{border:1px solid rgba(22,163,74,.14);border-radius:16px;padding:14px;background:var(--card);box-shadow:0 10px 25px rgba(0,0,0,.04)}
.comm-card-v24 .head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}
.comm-card-v24 .icon{font-size:25px}
.comm-card-v24 .title{font-weight:900}
.comm-card-v24 .muted{font-size:11px;color:var(--muted);font-weight:700;line-height:1.7}
.comm-status-v24{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:900;background:#fef3c7;color:#92400e}
.comm-status-v24.ready{background:#dcfce7;color:#166534}
.comm-form-v24{display:grid;gap:8px;margin-top:10px}
.comm-form-v24 input,.comm-form-v24 select,.comm-form-v24 textarea{width:100%;box-sizing:border-box;border:1px solid #dfe5e1;border-radius:10px;padding:9px 10px;background:var(--card);color:var(--ink);font-family:inherit;font-size:12px}
.comm-actions-v24{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.comm-mini-btn-v24{border:0;border-radius:10px;padding:8px 11px;cursor:pointer;font-family:inherit;font-weight:800;font-size:11px;background:var(--brand-soft);color:var(--brand)}
.comm-mini-btn-v24.primary{background:var(--brand);color:#fff}
.comm-note-v24{padding:10px 12px;border-radius:12px;background:var(--brand-soft);font-size:11px;font-weight:700;line-height:1.8;margin-top:10px}
.msg-choices-v24{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.msg-choice-v24{border:1px solid #dbe4de;background:var(--card);color:var(--ink);padding:6px 9px;border-radius:9px;cursor:pointer;font-size:11px;font-weight:800}
.msg-choice-v24.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.absent-actions-v24{display:inline-flex;gap:4px;margin-right:6px;vertical-align:middle}
.absent-actions-v24 button{border:0;border-radius:7px;padding:4px 6px;cursor:pointer;font-size:12px;background:var(--brand-soft)}
.absent-actions-v24 button:hover{transform:translateY(-1px)}
.notice-v24{border-right:4px solid #16a34a;background:var(--brand-soft);padding:12px 14px;border-radius:12px;margin-bottom:12px;font-size:12px;font-weight:800;line-height:1.8}
.duty-day-v24{background:var(--card);border:1px solid rgba(22,163,74,.14);border-radius:14px;padding:10px;box-shadow:var(--shadow);}.duty-row-v24{position:relative;background:var(--bg);border:1px solid rgba(148,163,184,.28);border-radius:12px;padding:9px;margin-bottom:9px;transition:all .2s ease}.duty-row-v24:hover{border-color:var(--brand);box-shadow:0 6px 18px -10px rgba(22,163,74,.5)}.duty-row-v24.filled{background:linear-gradient(135deg,rgba(240,253,244,.75),rgba(255,255,255,.2))}.duty-row-head-v24{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:7px;font-size:12px}.duty-num-v24{width:24px;height:24px;border-radius:50%;background:var(--brand);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:900}.duty-row-v24 .duty-field-v24{width:100%;margin-bottom:6px;font-size:12px;min-height:38px}.duty-clear-v24{position:absolute;left:6px;top:6px}.duty-row-v24 input[type=time]{direction:ltr;text-align:center}.duty-row-v24 select{padding-right:8px}@media(max-width:800px){.comm-grid-v24{grid-template-columns:1fr}.absent-actions-v24{display:flex;margin-top:5px}}
</style>

function gradesBoard(){  var sample=DB.students.slice(0,30);  return "<div class='card'><h2>📊 دفتر الدرجات</h2>"+    "<p class='desc'>📝 درجات من 100 · المعدل يُحسب تلقائياً</p>"+    (sample.length?"<div style='overflow-x:auto'><table><thead><tr><th>الطالب</th>"+    SUBJECTS.slice(0,4).map(function(s){return "<th style='text-align:center'>"+s+"</th>";}).join("")+    "<th style='text-align:center'>المعدل</th></tr></thead><tbody>"+    sample.map(function(st){var total=0,cnt=0;var cells=SUBJECTS.slice(0,4).map(function(sub){var v=st.grades&&st.grades[sub]?st.grades[sub]:'';if(v){total+=Number(v);cnt++;}return "<td style='text-align:center'><input class='inp' style='width:70px;padding:6px;text-align:center' data-act='grade' data-sid='"+esc(st.id)+"' data-sub='"+esc(sub)+"' type='number' min='0' max='100' value='"+v+"'></td>";}).join("");var avg=cnt?(total/cnt).toFixed(1):'-';var color=avg==='-'?'var(--muted)':(Number(avg)>=90?'#16a34a':Number(avg)>=75?'#2563eb':Number(avg)>=60?'#f59e0b':'#dc2626');return "<tr><td><b>"+esc(st.name)+"</b></td>"+cells+"<td style='text-align:center'><b style='color:"+color+"'>"+avg+"</b></td></tr>";}).join("")+    "</tbody></table></div><p style='color:var(--muted);font-size:12px;margin-top:10px'>💡 عرض أول 30 طالباً</p>"    :"<div class='empty'><span class='ico'>📊</span>لا يوجد طلاب</div>")+"</div>";}

function setLoginError(msg){
  var el=document.getElementById('lerr');
  if(el)el.textContent=msg||'';
}

function setLoginLoading(loading){
  var btn=document.getElementById('loginBtn');
  if(!btn)return;
  btn.disabled=loading;
  btn.style.opacity=loading?'0.7':'1';
  btn.innerHTML=loading?'⏳ جاري التحقق...':'🔓 دخول';
}

function saveSession_(result,username){
  var token=result&&result.token;
  if(!token && result&&result.data)token=result.data.token;
  if(!token && result&&result.sessionToken)token=result.sessionToken;
  if(!token && result&&result.data&&result.data.sessionToken)token=result.data.sessionToken;
  if(!token)return false;
  localStorage.setItem('zaid_session_token',String(token));
  localStorage.setItem('zaid_username',String(username||''));
  localStorage.setItem('zaid_auth','1');
  if(result.user) localStorage.setItem('zaid_user',JSON.stringify(result.user));
  else if(result.data&&result.data.user) localStorage.setItem('zaid_user',JSON.stringify(result.data.user));
  return true;
}

function clearSession_(){
  localStorage.removeItem('zaid_session_token');
  localStorage.removeItem('zaid_username');
  localStorage.removeItem('zaid_user');
  localStorage.removeItem('zaid_auth');
}

function render(){
  var r=document.getElementById('root');
  r.innerHTML=UI.auth?layout():loginHTML();
  if(UI.dark)document.documentElement.classList.add('dark');
  else document.documentElement.classList.remove('dark');
  var f=document.getElementById('loginForm');
  if(f)f.onsubmit=async function(e){
    e.preventDefault();
    var u=(document.getElementById('lu').value||'').trim();
    var p=document.getElementById('lp').value||'';
    setLoginError('');
    if(!u||!p){setLoginError('أدخل اسم المستخدم وكلمة المرور');return;}
    setLoginLoading(true);
    var controller=new AbortController();
    var timer=setTimeout(function(){controller.abort();},12000);
    try{
      var response=await fetch(APPS_SCRIPT_URL,{method:'POST',body:JSON.stringify({action:'login',username:u,password:p}),cache:'no-store',redirect:'follow',signal:controller.signal});
      var raw=await response.text();
      var result=null;
      try{result=JSON.parse(raw);}catch(parseErr){throw new Error('استجابة غير صالحة من الخادم: '+raw.slice(0,180));}
      if(result&&result.status==='success'){
        if(!saveSession_(result,u)) throw new Error('تم قبول الدخول لكن الخادم لم يُرجع رمز جلسة');
        UI.auth=true; render(); toast(result.message||'مرحباً بك في المنصة','ok'); playBeep(880,0.15);
      }else{
        var msg=(result&&result.message)||'بيانات الدخول غير صحيحة'; setLoginError(msg); toast(msg,'err'); vibrate([50,50,50]);
      }
    }catch(err){
      console.error('Login error:',err);
      if(err&&err.name==='AbortError'){setLoginError('انتهت مهلة الاتصال (12 ثانية). اضغط «اختبار اتصال الخادم» لمعرفة حالة V23.');toast('انتهت مهلة الاتصال','err');}
      else{setLoginError('تعذر الاتصال بخادم المدرسة. جرّب «اختبار اتصال الخادم» أولاً.');toast('تعذر الاتصال بقاعدة البيانات','err');}
    }finally{clearTimeout(timer);setLoginLoading(false);}
  };
  var testBtn=document.getElementById('apiTestBtn');
  if(testBtn)testBtn.onclick=async function(){
    setLoginError(''); testBtn.disabled=true; testBtn.textContent='⏳ اختبار الاتصال...';
    var controller=new AbortController(); var timer=setTimeout(function(){controller.abort();},10000);
    try{

    const data = {
        action: 'updateUser',
        sheetName: 'المستخدمين',
        recordData: {

                document.getElementById('empName').value,

window.sendToAPI = function(data) {
    var token=localStorage.getItem('zaid_session_token');
    var payload=Object.assign({},data);
    if(token)payload.token=token;
    toast('جاري إرسال البيانات...', 'info');
    fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
    })
    .then(function(response){return response.json();})
    .then(function(result){
        if(result.status === 'success') {
            toast(result.message || 'تمت العملية بنجاح', 'ok');
            var ids=['empName','empUsername','empPassword','empSpecialty','empGrades'];
            ids.forEach(function(id){var el=document.getElementById(id);if(el)el.value='';});
        } else {
            if(result.message && /جلسة|session|دخول|مصادقة|صلاحية/i.test(result.message)){
                clearSession_();UI.auth=false;render();
            }
            toast(result.message || 'تعذر تنفيذ العملية', 'err');
        }
    })
    .catch(function(error){console.error('API error:',error);toast('حدث خطأ في الاتصال بقاعدة البيانات','err');});
};

  function showCommModal(kind, student){
    var old=document.getElementById("commModalV24"); if(old)old.remove();
    var title=kind==="absence"?"إشعار غياب طالب":"إشعار للمعلم";
    var msg=kind==="absence"
      ?"السلام عليكم، نحيطكم علماً بغياب الطالب/ـة: "+student.name+" عن الحضور اليوم، نأمل الاطلاع والمتابعة."
      :"السلام عليكم، نود إشعاركم بتكليفكم بـ"+(student.type==="duty"?"المناوبة":"حصة الانتظار")+" في "+student.slot+".";
    var box=document.createElement("div");
    box.id="commModalV24";
    box.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:9999;display:flex;align-items:center;justify-content:center;padding:18px";
    box.innerHTML=
      '<div style="width:min(560px,100%);background:var(--card);color:var(--ink);border-radius:20px;padding:20px;box-shadow:0 25px 70px rgba(0,0,0,.3)">'+
      '<div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">📨 '+title+'</h2><button id="cmClose" class="comm-mini-btn-v24">✕</button></div>'+
      '<div class="notice-v24" style="margin-top:14px">اختر قناة أو أكثر. الإرسال الفعلي لن يبدأ إلا بعد إعداد مفاتيح الخدمة في الخادم.</div>'+
      '<div class="msg-choices-v24">'+
        '<button class="msg-choice-v24 on" data-ch="sms">📱 SMS</button>'+
        '<button class="msg-choice-v24" data-ch="telegram">🤖 Telegram</button>'+
        '<button class="msg-choice-v24" data-ch="whatsapp">🟢 WhatsApp</button>'+
      '</div>'+
      '<textarea id="commTextV24" class="inp" rows="5">'+esc(msg)+'</textarea>'+
      '<div class="comm-form-v24"><label>الإرسال قبل الموعد بـ <select id="leadV24"><option value="5">5 دقائق</option><option value="10" selected>10 دقائق</option><option value="15">15 دقيقة</option><option value="30">30 دقيقة</option></select></label></div>'+
      '<div class="comm-actions-v24"><button id="commSendV24" class="comm-mini-btn-v24 primary">📨 حفظ الطلب للإرسال</button><button id="commTestV24" class="comm-mini-btn-v24">🧪 اختبار الإعداد</button></div>'+
      '<div id="commResultV24" class="muted" style="margin-top:10px"></div>'+
      '</div>';
    document.body.appendChild(box);
    box.querySelector("#cmClose").onclick=function(){box.remove();};
    box.querySelectorAll("[data-ch]").forEach(function(b){b.onclick=function(){b.classList.toggle("on");};});
    box.querySelector("#commTestV24").onclick=function(){
      callMessaging("getMessagingConfig",{}).then(function(r){
        box.querySelector("#commResultV24").textContent=r.message||"تم فحص الإعدادات";
      }).catch(function(){box.querySelector("#commResultV24").textContent="تعذر الاتصال بالخادم";});
    };
    box.querySelector("#commSendV24").onclick=function(){
      var channels=[].slice.call(box.querySelectorAll("[data-ch].on")).map(function(x){return x.dataset.ch;});
      if(!channels.length){box.querySelector("#commResultV24").textContent="اختر قناة واحدة على الأقل";return;}
      callMessaging("queueMessage",{channels:channels,message:box.querySelector("#commTextV24").value,leadMinutes:Number(box.querySelector("#leadV24").value),target:student.target||student.name,phone:student.phone||"",chatId:student.chatId||"",type:kind})
      .then(function(r){box.querySelector("#commResultV24").textContent=r.message||"تم حفظ الطلب";})
      .catch(function(){box.querySelector("#commResultV24").textContent="تعذر حفظ الطلب";});
    };
  }

  function addAbsenceButtons(){
    if(!UI || !UI.auth || UI.tab!=="students") return;
    document.querySelectorAll("#stuRows tr").forEach(function(tr){
      if(tr.dataset.commAdded==="1") return;
      var btn=tr.querySelector("[data-act='att']");
      if(!btn || btn.textContent.indexOf("غائب")===-1) return;
      var id=btn.dataset.id, s=DB.students.find(function(x){return x.id===id;});
      if(!s)return;
      var cell=tr.querySelector("td");
      if(!cell)return;
      var wrap=document.createElement("span");wrap.className="absent-actions-v24";
      wrap.innerHTML='<button title="إرسال SMS">📱</button><button title="Telegram">🤖</button><button title="WhatsApp">🟢</button>';
      wrap.querySelectorAll("button").forEach(function(b){b.onclick=function(){showCommModal("absence",s);};});
      cell.appendChild(wrap);tr.dataset.commAdded="1";
    });
  }

  function addCommQuickCards(){
    if(!UI || !UI.auth || UI.tab!=="home" || document.getElementById("commQuickV24")) return;
    var host=document.querySelector(".main");if(!host)return;
    var c=document.createElement("div");c.id="commQuickV24";c.className="comm-panel-v24";
    c.innerHTML='<div class="card"><h2 style="margin-top:0">📨 مركز الإشعارات الذكي</h2>'+
      '<div class="notice-v24">ثلاث قنوات قابلة للتفعيل: SMS + Telegram + WhatsApp. يمكن اختيار قناة واحدة أو أكثر، وتحديد وقت التنبيه المسبق للمناوبة والانتظار.</div>'+
      '<div class="comm-grid-v24">'+
      '<div class="comm-card-v24"><div class="head"><span><span class="icon">📱</span> <span class="title">SMS</span></span><span class="comm-status-v24">يحتاج إعداد</span></div><div class="muted">إدخال بيانات مزود الرسائل واسم المرسل من إعدادات المنصة.</div></div>'+
      '<div class="comm-card-v24"><div class="head"><span><span class="icon">🤖</span> <span class="title">Telegram</span></span><span class="comm-status-v24">يحتاج إعداد</span></div><div class="muted">توكن البوت + Chat ID للمعلمين/المستلمين.</div></div>'+
      '<div class="comm-card-v24"><div class="head"><span><span class="icon">🟢</span> <span class="title">WhatsApp</span></span><span class="comm-status-v24">يحتاج إعداد</span></div><div class="muted">WhatsApp Business API / مزود API معتمد.</div></div>'+
      '</div></div>';
    host.insertBefore(c,host.firstElementChild);
  }

  function enhanceSmsBoard(){
    if(!UI || !UI.auth || UI.tab!=="sms")return;
    var card=document.querySelector(".main .card");if(!card||card.dataset.commEnhanced==="1")return;
    card.dataset.commEnhanced="1";
    var old=card.innerHTML;
    card.innerHTML=
      '<h2>💬 مركز الرسائل والقنوات</h2>'+
      '<div class="notice-v24">هذه الصفحة مخصصة لإعداد قنوات المدرسة. المفاتيح السرية لا تُحفظ داخل index.html؛ سيتم حفظها في خصائص خادم Google Apps Script.</div>'+
      '<div class="comm-grid-v24">'+
      '<div class="comm-card-v24"><div class="head"><span class="title">📱 SMS</span><span class="comm-status-v24">قابل للربط</span></div><div class="comm-form-v24"><input id="smsProviderV24" placeholder="اسم مزود SMS (مثلاً فورجوالي)"><input id="smsSenderV24" placeholder="اسم المرسل المعتمد"><input id="smsApiV24" placeholder="رابط API للمزود"><input id="smsKeyV24" type="password" placeholder="API Key / Secret"></div></div>'+
      '<div class="comm-card-v24"><div class="head"><span class="title">🤖 Telegram Bot</span><span class="comm-status-v24">قابل للربط</span></div><div class="comm-form-v24"><input id="tgTokenV24" type="password" placeholder="Bot Token"><input id="tgDefaultChatV24" placeholder="Chat ID الافتراضي"><div class="muted">يمكن تخصيص Chat ID لكل معلم لاحقاً.</div></div></div>'+
      '<div class="comm-card-v24"><div class="head"><span class="title">🟢 WhatsApp</span><span class="comm-status-v24">قابل للربط</span></div><div class="comm-form-v24"><input id="waPhoneIdV24" placeholder="Phone Number ID"><input id="waTokenV24" type="password" placeholder="Access Token"><input id="waApiV24" placeholder="رابط Graph API / مزود WhatsApp"></div></div>'+
      '</div>'+
      '<div class="comm-card-v24" style="margin-top:12px"><div class="head"><span class="title">⏰ التنبيهات المجدولة</span></div>'+
      '<div class="comm-grid-v24"><div><label class="muted">المناوبة: قبل</label><select id="dutyLeadV24" class="inp"><option>5 دقائق</option><option selected>10 دقائق</option><option>15 دقيقة</option><option>30 دقيقة</option></select></div>'+
      '<div><label class="muted">حصة الانتظار: قبل</label><select id="waitLeadV24" class="inp"><option>5 دقائق</option><option selected>10 دقائق</option><option>15 دقيقة</option><option>30 دقيقة</option></select></div>'+
      '<div><label class="muted">الغياب: إرسال</label><select id="absLeadV24" class="inp"><option selected>فوراً</option><option>5 دقائق</option><option>10 دقائق</option></select></div></div>'+
      '<div class="comm-actions-v24"><button id="saveCommV24" class="comm-mini-btn-v24 primary">💾 حفظ إعدادات القنوات</button><button id="testCommV24" class="comm-mini-btn-v24">🧪 اختبار الإعدادات</button></div>'+
      '<div id="commSaveResultV24" class="muted" style="margin-top:8px"></div></div>';
    document.getElementById("saveCommV24").onclick=function(){
      var payload={sms:{provider:document.getElementById("smsProviderV24").value,sender:document.getElementById("smsSenderV24").value,apiUrl:document.getElementById("smsApiV24").value,key:document.getElementById("smsKeyV24").value},telegram:{token:document.getElementById("tgTokenV24").value,chatId:document.getElementById("tgDefaultChatV24").value},whatsapp:{phoneNumberId:document.getElementById("waPhoneIdV24").value,token:document.getElementById("waTokenV24").value,apiUrl:document.getElementById("waApiV24").value},timing:{duty:document.getElementById("dutyLeadV24").value,waiting:document.getElementById("waitLeadV24").value,absence:document.getElementById("absLeadV24").value}};
      callMessaging("saveMessagingConfig",payload).then(function(r){document.getElementById("commSaveResultV24").textContent=r.message||"تم الحفظ";}).catch(function(){document.getElementById("commSaveResultV24").textContent="تعذر الحفظ — تأكد من تحديث Web App بعد إضافة دعم الرسائل.";});
    };
    document.getElementById("testCommV24").onclick=function(){callMessaging("getMessagingConfig",{}).then(function(r){document.getElementById("commSaveResultV24").textContent=r.message||"تم الاختبار";}).catch(function(){document.getElementById("commSaveResultV24").textContent="تعذر الاختبار";});};
  }

  var lastTab="";
  setInterval(function(){
    try{
      if(UI && UI.auth){
        if(UI.tab!==lastTab){lastTab=UI.tab;}
        addCommQuickCards();
        addAbsenceButtons();
        enhanceSmsBoard();
      }
    }catch(e){}
  },800);

  window.schoolMessagingV24={showAbsence:function(id){var s=DB.students.find(function(x){return x.id===id;});if(s)showCommModal("absence",s);}};
})();
</script>
</body></html>
